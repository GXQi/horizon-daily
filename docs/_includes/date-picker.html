<div class="hz-datebar">
  <div class="hz-datebar-title">📅 选择日期看当天日报 <span class="hz-datebar-sub">Pick a date</span></div>
  <div class="hz-datebar-controls">
    <input type="date" id="hz-date-input" class="hz-date-input" aria-label="选择日期">
    <button type="button" id="hz-date-go" class="hz-date-btn">查看 · View</button>
    <a class="hz-date-btn hz-date-ghost" href="{{ '/archive' | relative_url }}">全部历史 · Archive</a>
  </div>
  <div class="hz-date-msg" id="hz-date-msg" role="status" aria-live="polite"></div>
  <div class="hz-quick" id="hz-quick"></div>
</div>
<script>
  window.HZ_POSTS = [
  {%- for post in site.posts -%}
    {"date":"{{ post.date | date: '%Y-%m-%d' }}","lang":"{{ post.lang }}","url":"{{ post.url | relative_url }}"}{% unless forloop.last %},{% endunless %}
  {%- endfor -%}
  ];
</script>
